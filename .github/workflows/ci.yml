# CI 最小構成(handoff/04 2 章):
# 静的検査 + wasm-pack build + 単体テスト(プッシュ毎)+ バイナリサイズチェック
# 生成物(web/src/wasm/)は CI がビルドしてコミットする(開発者は Rust 環境不要)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # 自動ビルドした生成物を main へコミットするため

jobs:
  rust:
    name: Rust (core / core-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml で固定したバージョンを使う(生成物の再現性のため)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: cargo fmt --check
        run: |
          cargo fmt --check --manifest-path core/Cargo.toml
          cargo fmt --check --manifest-path core-wasm/Cargo.toml

      - name: cargo clippy
        run: |
          cargo clippy --manifest-path core/Cargo.toml -- -D warnings
          cargo clippy --manifest-path core-wasm/Cargo.toml -- -D warnings

      - name: cargo test (core)
        run: cargo test --manifest-path core/Cargo.toml

      - name: Verify WASM optimization profile
        # 速度優先の opt-level=3 を CI でも保証する
        run: grep -q '^opt-level = 3' core-wasm/Cargo.toml

      - name: wasm-pack build (opt-level=3)
        # RUSTFLAGS でパスを remap する(runner のパスを生成物に埋め込まない)ため、
        # npm script 経由で実行する。Cargo.toml の opt-level=3 が適用される
        working-directory: web
        run: npm run wasm:build

      - name: Check binary size (<= 500 KB, handoff/02 検収基準)
        run: |
          SIZE=$(stat -c%s web/src/wasm/photomosaic_core_wasm_bg.wasm)
          echo "photomosaic_core_wasm_bg.wasm: ${SIZE} bytes"
          test "$SIZE" -le 512000

      - name: Commit rebuilt artifacts if outdated
        # 生成物は main に同梱し、CI が最新ソースから再ビルドして更新する。
        # 開発者は Rust 環境なしで Web 開発を続けられる
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain web/src/wasm)" ]; then
            echo "committed artifacts are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/wasm
          git commit -m "chore(wasm): rebuild artifacts from latest core sources [skip ci]"
          git push

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm
          retention-days: 7

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact (wasm-pack build 成果物)
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/src/wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: tsc --noEmit
        working-directory: web
        run: npm run typecheck

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Prettier
        working-directory: web
        run: npm run format:check

      - name: Vitest(WASM 生成物を使う結合テストを含む)
        working-directory: web
        run: npm test

      - name: vite build
        working-directory: web
        run: npm run build

  android:
    name: Android (Kotlin / Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Gradle の buildCoreGlue が wasm-pack を呼ぶため、Rust 側と同じ固定版を使う
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Static checks and unit tests
        working-directory: android
        run: ./gradlew :app:detekt :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Verify INTERNET permission is not declared
        working-directory: android
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk \
            | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission must not be declared (offline guarantee)" >&2
            exit 1
          fi
